name: iOS CI (Xcode on GitHub)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      CONFIGURATION: Release
      EXPORT_METHOD: app-store-connect
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER || 'com.MindHarborAI.app' }}
      XCODE_SCHEME: ${{ vars.XCODE_SCHEME || vars.XCODE_SCHEME_OVERRIDE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare Xcode project
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null; then
            if command -v brew >/dev/null; then
              brew install xcodegen
            elif command -v gem >/dev/null; then
              gem install xcodegen --no-document
            else
              echo "No installer available for xcodegen."
              exit 1
            fi
          fi

          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 6 -print -quit || true)
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 6 -print -quit || true)

          if [ -z "$WORKSPACE" ] && [ -z "$PROJECT" ]; then
            if [ -f project.yml ]; then
              xcodegen generate
            else
              echo "No .xcworkspace, .xcodeproj, or project.yml was found."
              exit 1
            fi
          fi

      - name: Resolve project
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 6 -print | head -n 1 || true)
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 6 -print | head -n 1 || true)

          if [ -z "$WORKSPACE" ] && [ -z "$PROJECT" ]; then
            echo "No .xcworkspace or .xcodeproj was found in repository."
            exit 1
          fi

          if [ -n "$WORKSPACE" ]; then
            echo "BUILD_TYPE=workspace" >> "$GITHUB_OUTPUT"
            echo "TARGET=$WORKSPACE" >> "$GITHUB_OUTPUT"
            SCHEME_LIST=$(xcodebuild -list -workspace "$WORKSPACE")
          else
            echo "BUILD_TYPE=project" >> "$GITHUB_OUTPUT"
            echo "TARGET=$PROJECT" >> "$GITHUB_OUTPUT"
            SCHEME_LIST=$(xcodebuild -list -project "$PROJECT")
          fi

          if [ -n "${XCODE_SCHEME:-}" ]; then
            SCHEME="$XCODE_SCHEME"
          else
            SCHEME=$(echo "$SCHEME_LIST" | awk '/^    Schemes:/{p=1; next} p && /^\s{4}\S/{print $1; exit}')
          fi

          if [ -z "$SCHEME" ]; then
            if [ -n "$PROJECT" ]; then
              SCHEME="$(basename "$PROJECT" .xcodeproj)"
            elif [ -n "$WORKSPACE" ]; then
              SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
            fi
          fi

          if [ -z "$SCHEME" ]; then
            echo "Could not detect a scheme. Set XCODE_SCHEME_OVERRIDE in repository environment variables."
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build (for every push)
        run: |
          set -euo pipefail
          if [ "${{ steps.resolve.outputs.BUILD_TYPE }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.resolve.outputs.TARGET }}" -scheme "${{ steps.resolve.outputs.SCHEME }}" -configuration "$CONFIGURATION" -destination "generic/platform=iOS" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
          else
            xcodebuild -project "${{ steps.resolve.outputs.TARGET }}" -scheme "${{ steps.resolve.outputs.SCHEME }}" -configuration "$CONFIGURATION" -destination "generic/platform=iOS" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
          fi

      - name: Archive and export IPA (manual run)
        if: github.event_name == 'workflow_dispatch'
        id: export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APP_STORE_CONNECT_API_KEY_ID:-}" ] || [ -z "${APP_STORE_CONNECT_API_ISSUER_ID:-}" ] || [ -z "${APP_STORE_CONNECT_API_PRIVATE_KEY:-}" ]; then
            echo "Required Apple team/App Store Connect secrets are missing."
            exit 1
          fi

          ARCHIVE_PATH="$RUNNER_TEMP/${{ steps.resolve.outputs.SCHEME }}.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"
          API_KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$EXPORT_PATH"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$API_KEY_PATH"

          AUTH_ARGS=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$API_KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
          )

          if [ "${{ steps.resolve.outputs.BUILD_TYPE }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.resolve.outputs.TARGET }}" -scheme "${{ steps.resolve.outputs.SCHEME }}" -configuration "$CONFIGURATION" -destination "generic/platform=iOS" -archivePath "$ARCHIVE_PATH" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= archive
          else
            xcodebuild -project "${{ steps.resolve.outputs.TARGET }}" -scheme "${{ steps.resolve.outputs.SCHEME }}" -configuration "$CONFIGURATION" -destination "generic/platform=iOS" -archivePath "$ARCHIVE_PATH" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= archive
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${AUTH_ARGS[@]}"

          IPA_PATH=$(find "$EXPORT_PATH" -name "*.ipa" -type f -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was produced by the archive export."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.export.outputs.IPA_PATH }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
