name: iOS CI Plain
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Prepare Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then
            if command -v brew >/dev/null; then
              brew install xcodegen
            elif command -v gem >/dev/null; then
              gem install xcodegen --no-document
            else
              echo "No installer available for xcodegen."
              exit 1
            fi
          fi
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 6 -print -quit || true)
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 6 -print -quit || true)
          if [ -z "$WORKSPACE" ] && [ -z "$PROJECT" ]; then
            if [ -f project.yml ]; then
              xcodegen generate
            else
              echo "No xcode project found."
              exit 1
            fi
          fi
      - name: Resolve and Build
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 6 -print -quit || true)
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 6 -print -quit || true)
          if [ -z "$WORKSPACE" ] && [ -z "$PROJECT" ]; then
            echo "No xcode project found."
            exit 1
          fi
          if [ -n "$WORKSPACE" ]; then
            echo "Workspace: $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" -list
          else
            echo "Project: $PROJECT"
            xcodebuild -list -project "$PROJECT"
          fi
